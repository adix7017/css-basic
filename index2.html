<!DOCTYPE html>
<html>
<head>
  <title>Product Card</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: white;
    }

    .card {
      width: 250px;
      background-color: white;
      padding: 15px;
      margin: 50px auto;
      border: 1px solid #ddd;
      border-radius: 5px;
      text-align: center;
    }

    .card img {
      width: 100%;
      height: auto;
    }

    .card h2 {
      font-size: 20px;
      margin: 10px 0;
    }

    .card p {
      color: gray;
      font-size: 14px;
      margin: 5px 0;
    }

    .price {
      margin: 10px 0;
    }

    .old {
      text-decoration: line-through;
      color: grey;
    }

    .new {
      color: green;
      font-weight: bold;
    }

    button {
      padding: 8px 12px;
      margin: 5px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }

    .add {
      background-color: rgb(239, 233, 233);
      border: 1px solid #ccc;
    }

    .buy {
      background-color: #0078d7;
      color: white;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="photo.jpg.webp" alt="AirSound Pro">
    <h2>AirSound Pro</h2>
    <p>Wireless Headphones</p>
    <div class="price">
    </div>
    <button class="add">Add to Cart</button>
    <button class="buy">Buy Now</button>
  </div>
</body>
</html>
